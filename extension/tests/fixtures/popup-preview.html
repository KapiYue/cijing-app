<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Popup visual fixture</title>
  <link rel="stylesheet" href="../../popup/popup.css">
</head>
<body>
<script type="module">
  const params = new URLSearchParams(location.search);
  const signedIn = params.get("signedIn") !== "false";
  const email = params.get("email") || "learner@cijing.app";
  const preferences = {
    autoSave: params.get("autoSave") === "true",
    saveContext: true,
    privacyMode: params.get("privacy") === "true",
    disabledHosts: params.get("siteDisabled") === "true" ? ["example.com"] : [],
    theme: params.get("theme") || "purple"
  };
  globalThis.chrome = {
    storage: { local: {
      async get(key) { return { [key]: key === "cijingPreferences" ? preferences : null }; },
      async set(values) { Object.assign(preferences, values.cijingPreferences || {}); }
    } },
    tabs: { async query() { return [{ url: "https://example.com/article" }]; } },
    runtime: {
      openOptionsPage() {},
      async sendMessage(message) {
        if (message.type === "GET_SESSION") return { ok: true, data: signedIn ? { signedIn: true, email } : { signedIn: false } };
        if (message.type === "GET_DASHBOARD") return { ok: true, data: {
          plan: { review_due: 6, new_suggested: 4, weak_count: 1 },
          recent: [
            { term: "resilient", primary_meaning: "有韧性的；适应力强的" },
            { term: "momentum", primary_meaning: "动力；势头" },
            { term: "progress", primary_meaning: "进步；进展" },
            { term: "useful", primary_meaning: "有用的；有益的" }
          ]
        } };
        return { ok: true, data: {} };
      }
    }
  };
  const source = await fetch("../../popup/popup.html").then((response) => response.text());
  const parsed = new DOMParser().parseFromString(source, "text/html");
  document.body.innerHTML = parsed.body.innerHTML;
  await import("../../popup/popup.js");
</script>
</body>
</html>
